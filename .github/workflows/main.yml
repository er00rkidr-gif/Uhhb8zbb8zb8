name: Build Pip Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unzip project if it was uploaded as a .zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z"
            mkdir -p _unzipped
            unzip -oq "$z" -d _unzipped
          done

      - name: Find the Gradle project folder
        id: find
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found anywhere. Files in repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build jar
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: piphorror-mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
